name: Python quality

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install project and development tools
        run: python -m pip install -e ".[dev]"
      - name: Run tests
        run: pytest --cov=trading.risk --cov=trading.portfolio --cov=trading.execution --cov-report=term-missing --cov-fail-under=90
      - name: Lint
        run: ruff check .
      - name: Type check
        run: mypy src
